<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="mapleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded app style -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="500" height="500" x="6" y="6" rx="106" fill="none" stroke="#334155" stroke-width="4" opacity="0.6" />

  <!-- Outer Ring decorative circle -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.3" stroke-dasharray="12 8" />
  
  <!-- Central Emblem Shield Background -->
  <polygon points="256,90 380,160 380,330 256,410 132,330 132,160" fill="#090d16" stroke="#475569" stroke-width="4" opacity="0.9" />

  <!-- Maple Leaf / Artale Emblem in Center -->
  <g transform="translate(256, 250) scale(1.15)" filter="url(#glow)">
    <!-- Maple Leaf Paths -->
    <path d="M 0,-105 
             C 15,-65 35,-60 55,-75 
             C 45,-45 60,-40 90,-45 
             C 70,-20 85,-10 110,-5 
             C 80,15 75,30 85,55 
             C 60,45 45,60 40,85 
             C 25,60 15,65 5,80 
             L 5,115 L -5,115 L -5,80 
             C -15,65 -25,60 -40,85 
             C -45,60 -60,45 -85,55 
             C -75,30 -80,15 -110,-5 
             C -85,-10 -70,-20 -90,-45 
             C -60,-40 -45,-45 -55,-75 
             C -35,-60 -15,-65 0,-105 Z" 
          fill="url(#mapleGrad)" />
    
    <!-- Crossed Golden Swords behind / on leaf -->
    <path d="M -60,-60 L 60,60 M -50,-70 L -70,-50 M 50,70 L 70,50" stroke="#fef08a" stroke-width="6" stroke-linecap="round" opacity="0.8" />
    <path d="M 60,-60 L -60,60 M 70,-50 L 50,-70 M -70,50 L -50,70" stroke="#fef08a" stroke-width="6" stroke-linecap="round" opacity="0.8" />

    <!-- Center Star Core -->
    <polygon points="0,-25 7,-7 25,0 7,7 0,25 -7,7 -25,0 -7,-7" fill="#ffffff" />
  </g>

  <!-- Title Badge Text -->
  <rect x="146" y="420" width="220" height="42" rx="21" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2" />
  <text x="256" y="447" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="2">
    NYXSHADE
  </text>
</svg>
